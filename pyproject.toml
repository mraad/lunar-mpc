[project]
name = "lunar-mpc"
version = "0.1.0"
description = "Adaptive model predictive control for LunarLander with a VanillaJS control lab"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = [
    "gymnasium[box2d]>=1.1.1",
    "numpy>=1.26",
]

[project.scripts]
lunar-mpc = "lunar_mpc.mpc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_mpc"]

[tool.uv]
# box2d-py builds from sdist and needs SWIG on PATH during the build.
# uv installs it into the isolated build env via this extra build dependency.
extra-build-dependencies = { box2d-py = ["swig"] }
